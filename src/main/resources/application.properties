spring.application.name=PDF_Agent

spring.security.user.name = Ravi
spring.security.user.password=123456

spring.datasource.url=jdbc:mysql://localhost:3306/collagedb
spring.datasource.username=root
spring.datasource.password=root

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

server.tomcat.threads.max=${TOMCAT_THREADS_MAX}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE}

spring.servlet.multipart.max-file-size=${MAX_PDF_SIZE}
spring.servlet.multipart.max-request-size=${MAX_PDF_SIZE}
jwt.secret=${JWT_SECRET}

spring.jpa.hibernate.ddl-auto=update

spring.mvc.async.request-timeout=900000