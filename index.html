<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Agent</title>
<!--
  HOW TO RUN
  1. Serve this folder:   python -m http.server 5500      then open http://localhost:5500
  2. Backend (Spring) changes needed once:

     a) CORS (SecurityConfig):
        http.cors(Customizer.withDefaults());
        @Bean CorsConfigurationSource corsConfigurationSource() {
            CorsConfiguration c = new CorsConfiguration();
            c.setAllowedOrigins(List.of("http://localhost:5500"));
            c.setAllowedMethods(List.of("GET","POST","PATCH","DELETE","OPTIONS"));
            c.setAllowedHeaders(List.of("Authorization","Content-Type","Accept"));
            UrlBasedCorsConfigurationSource s = new UrlBasedCorsConfigurationSource();
            s.registerCorsConfiguration("/**", c);
            return s;
        }

     b) OAuth success handler: redirect back to this page instead of writing JSON:
        res.sendRedirect("http://localhost:5500/#token=" + token);

  Change CONFIG below if your ports differ.
-->
<style>
:root{
  --bg:#faf9f5; --side:#f3f1ea; --panel:#ffffff; --ink:#1f1e1d; --muted:#73726c; --line:#e6e3d9;
  --accent:#c6613f; --accent-h:#b3532f; --user:#efece3; --ok:#3d7a4a; --warn:#a8741a; --bad:#b3392f;
  --serif: ui-serif, Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#262624; --side:#1f1e1d; --panel:#30302e; --ink:#f0eee6; --muted:#a09e96; --line:#3d3d3a; --user:#3a3936; --ok:#7bc08a; --warn:#e0b05a; --bad:#e8796e; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
svg{display:block}

/* ---------- auth ---------- */
.auth{min-height:100%;display:grid;place-items:center;padding:24px}
.auth-card{width:100%;max-width:400px}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--accent);margin-bottom:8px}
.logo svg{width:30px;height:30px}
.logo span{font-family:var(--serif);font-size:30px;color:var(--ink)}
.auth h1{font-family:var(--serif);font-weight:400;font-size:28px;text-align:center;margin:10px 0 4px}
.auth .sub{text-align:center;color:var(--muted);margin:0 0 24px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.oauth{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:500;transition:.15s}
.btn:hover{background:var(--user)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-h)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.tabs{display:flex;background:var(--user);border-radius:10px;padding:3px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input[type=text],input[type=password],input[type=email]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(198,97,63,.15)}
.err{color:var(--bad);font-size:13px;margin:12px 0 0;min-height:18px}
.form .btn{margin-top:16px}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:280px 1fr;height:100dvh}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:8px;padding:16px 16px 8px;color:var(--accent)}
.brand svg{width:22px;height:22px}
.brand span{font-family:var(--serif);font-size:20px;color:var(--ink)}
.newchat{margin:10px 12px 6px;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:500}
.newchat:hover{border-color:var(--accent)}
.newchat .pl{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:16px;line-height:1}
.label{padding:14px 18px 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.list{flex:1;overflow:auto;padding:0 8px}
.item{display:flex;align-items:center;gap:4px;padding:8px 10px;border-radius:9px;cursor:pointer}
.item:hover,.item.on{background:var(--user)}
.item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .acts{display:none;gap:2px}
.item:hover .acts{display:flex}
.ib{border:0;background:transparent;padding:4px;border-radius:6px;color:var(--muted);display:grid;place-items:center}
.ib:hover{background:var(--line);color:var(--ink)}
.ib svg{width:15px;height:15px}
.empty-list{padding:10px 12px;color:var(--muted);font-size:13px}
.user{display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.user .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);min-height:52px}
.top .title{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .menu{display:none}
.pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:13px}
.pill:hover{border-color:var(--accent)}
.pill svg{width:15px;height:15px}
#stage{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- upload ---------- */
.up{flex:1;overflow:auto;display:grid;place-items:center;padding:24px}
.up-in{width:100%;max-width:560px;text-align:center}
.up-in .logo{margin-bottom:12px}
.up-in h2{font-family:var(--serif);font-weight:400;font-size:32px;margin:0 0 8px}
.up-in p{color:var(--muted);margin:0 0 24px}
.drop{border:2px dashed var(--line);border-radius:18px;padding:36px 20px;background:var(--panel);transition:.15s}
.drop.over{border-color:var(--accent);background:var(--user)}
.drop svg{width:38px;height:38px;color:var(--accent);margin:0 auto 10px}
.drop .btn{width:auto;display:inline-flex;margin-top:14px;padding:10px 20px}
.drop small{display:block;color:var(--muted);margin-top:12px}
.steps{list-style:none;padding:0;margin:0;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 18px}
.steps li{display:flex;align-items:center;gap:12px;padding:12px 0;color:var(--muted)}
.steps li+li{border-top:1px solid var(--line)}
.steps li.active,.steps li.done{color:var(--ink)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:12px}
.active .dot{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.fail .dot{background:var(--bad);border-color:var(--bad);color:#fff}
.steps li.fail{color:var(--bad)}
@keyframes spin{to{transform:rotate(360deg)}}
.fname{margin:0 0 14px;font-weight:500}
.up-err{color:var(--bad);margin-top:14px;font-size:14px}
.retry{margin-top:12px;width:auto;display:inline-flex}

/* ---------- chat ---------- */
.msgs{flex:1;overflow:auto;padding:24px 16px 8px}
.col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.msg.user{display:flex;justify-content:flex-end}
.bubble{background:var(--user);padding:10px 16px;border-radius:18px;max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.msg.agent{display:flex;gap:12px;align-items:flex-start}
.av{width:28px;height:28px;color:var(--accent);flex:none;margin-top:1px}
.av svg{width:100%;height:100%}
.body{flex:1;min-width:0}
.txt{font-family:var(--serif);font-size:16.5px;line-height:1.65;word-wrap:break-word}
.txt p{margin:0 0 .9em}.txt p:last-child{margin:0}
.txt ul,.txt ol{margin:.2em 0 .9em;padding-left:1.4em}
.txt h3,.txt h4,.txt h5,.txt h6{font-family:var(--serif);margin:1em 0 .4em}
.txt code{background:var(--user);padding:1px 5px;border-radius:5px;font-size:.88em}
.txt pre{background:var(--side);padding:12px;border-radius:10px;overflow:auto}
.txt pre code{background:none;padding:0}
.pg{background:var(--user);color:var(--accent);font-family:var(--sans);font-size:12px;padding:1px 7px;border-radius:999px;white-space:nowrap}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-top:6px}
.status:empty{display:none}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;font-size:12.5px}
button.chip:hover{border-color:var(--accent)}
.badge{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid currentColor}
.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.bad{color:var(--bad)}
.excerpt{width:100%;font-size:13.5px;color:var(--muted);background:var(--side);border-radius:10px;padding:10px 12px;margin-top:2px}
.warns{margin:8px 0 0;padding-left:18px;color:var(--warn);font-size:13.5px}
.err-txt{color:var(--bad)}
.tools{display:flex;gap:8px;margin-top:8px}
.speak{display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer}
.speak svg{width:14px;height:14px}
.speak.on{border-color:var(--accent);color:var(--accent)}
/* agent trace (collapsible thinking + flow) */
.trace{margin:0 0 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-family:var(--sans);font-size:13.5px}
.trace>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 12px;color:var(--muted)}
.trace>summary::-webkit-details-marker{display:none}
.trace>summary .car{margin-left:auto;transition:transform .15s;font-size:16px;line-height:1}
.trace[open]>summary .car{transform:rotate(90deg)}
.done-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:2px 12px 10px}
.fl{padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:12.5px}
.fl.on{border-color:var(--accent);color:var(--accent)}
.fl.ok{border-color:var(--ok);color:var(--ok)}
.fa{color:var(--muted)}
.tsteps{list-style:none;margin:0;padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.tsteps li{padding-left:12px;border-left:2px solid var(--line)}
.tsteps .who{font-size:12px;color:var(--accent);margin-bottom:2px}
.tsteps code{background:var(--user);padding:1px 6px;border-radius:5px;font-size:12.5px;word-break:break-word}
.tsteps details>summary{cursor:pointer;color:var(--muted)}
.psg{margin-top:6px;padding:8px 10px;background:var(--side);border-radius:8px;color:var(--muted);font-size:12.5px;line-height:1.5}
.psg p{margin:0 0 .5em}
/* original vs simplified overlay */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:grid;place-items:center;padding:16px}
.ovc{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:100%;max-width:1100px;max-height:90dvh;display:flex;flex-direction:column}
.ovh{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ovh h3{margin:0;font-family:var(--serif);font-weight:400;font-size:20px;flex:1}
.ovb{overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:18px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col2{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;white-space:pre-wrap;word-wrap:break-word;font-size:14px}
.col2 h5{margin:0 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sec-t{font-family:var(--serif);font-size:17px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sec-w{color:var(--warn);font-size:13px;margin:8px 0 0}
@media (max-width:800px){.cmp{grid-template-columns:1fr}}
.composer-wrap{padding:8px 16px 14px}
.composer{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:10px 10px 10px 18px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.composer:focus-within{border-color:var(--accent)}
.composer textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:inherit;max-height:180px;padding:6px 0;line-height:1.5}
.send{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.send:hover{background:var(--accent-h)}
.send:disabled{opacity:.4;cursor:not-allowed}
.send svg{width:18px;height:18px}
.fine{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:50;font-size:14px;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
.scrim{display:none}

@media (max-width:800px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:30;transform:translateX(-100%);transition:.2s}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
  .top .menu{display:grid}
  .pill span{display:none}
}
</style>
</head>
<body>

<!-- ================= AUTH ================= -->
<div id="auth" class="auth hidden">
  <div class="auth-card">
    <div class="logo"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/><path fill="currentColor" opacity=".55" d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg><span>PDF Agent</span></div>
    <h1 id="authTitle">Welcome back</h1>
    <p class="sub">Understand any financial document in plain language.</p>
    <div class="panel">
      <div class="oauth">
        <button class="btn" data-oauth="google" type="button">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23 12.3c0-.8-.1-1.5-.2-2.3H12v4.4h6.2a5.3 5.3 0 0 1-2.3 3.5v2.9h3.7c2.2-2 3.4-5 3.4-8.5z"/><path fill="#34A853" d="M12 24c3.1 0 5.7-1 7.6-2.8l-3.7-2.9c-1 .7-2.3 1.1-3.9 1.1-3 0-5.5-2-6.4-4.8H1.8v3A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.6 14.6a7.2 7.2 0 0 1 0-4.6V7H1.8a12 12 0 0 0 0 10.8z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.2.6 4.4 1.7l3.3-3.3A12 12 0 0 0 1.8 7l3.8 3c.9-2.800 3.400-5.200 6.400-5.200z"/></svg>
          Continue with Google
        </button>
        <button class="btn" data-oauth="github" type="button">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.2.8-.6v-2c-3.200.7-3.900-1.400-3.900-1.400-.5-1.300-1.300-1.700-1.300-1.700-1-.7.1-.7.1-.7 1.200.1 1.800 1.200 1.800 1.200 1 1.800 2.800 1.300 3.400 1 .1-.8.4-1.300.7-1.600-2.600-.3-5.300-1.300-5.300-5.700 0-1.300.5-2.300 1.200-3.100-.1-.3-.5-1.500.1-3.100 0 0 1-.3 3.200 1.200a11 11 0 0 1 5.800 0c2.200-1.500 3.200-1.200 3.200-1.200.6 1.600.2 2.800.1 3.100.8.800 1.200 1.800 1.200 3.100 0 4.400-2.700 5.400-5.300 5.700.4.400.8 1.100.8 2.200v3.200c0 .4.2.7.8.6A11.500 11.500 0 0 0 12 .5z"/></svg>
          Continue with GitHub
        </button>
      </div>
      <div class="or">or use your username</div>
      <div class="tabs">
        <button id="tabIn" class="on" type="button">Sign in</button>
        <button id="tabUp" type="button">Create account</button>
      </div>
      <form id="authForm" class="form" autocomplete="on">
        <label for="fUser">Username</label>
        <input id="fUser" type="text" autocomplete="username" required>
        <div id="emailRow" class="hidden">
          <label for="fEmail">Email</label>
          <input id="fEmail" type="email" autocomplete="email">
        </div>
        <label for="fPass">Password</label>
        <input id="fPass" type="password" autocomplete="current-password" required>
        <div id="authErr" class="err"></div>
        <button id="authBtn" class="btn primary" type="submit">Sign in</button>
      </form>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="app hidden">
  <div id="scrim" class="scrim"></div>
  <aside id="side" class="side">
    <div class="brand"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg><span>PDF Agent</span></div>
    <button id="newChat" class="newchat"><span class="pl">+</span> New chat</button>
    <div class="label">Recents</div>
    <div id="list" class="list"></div>
    <div class="user">
      <div id="avatar" class="avatar">?</div>
      <div id="uname" class="n"></div>
      <button id="logout" class="ib" title="Sign out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <button id="menu" class="ib menu" title="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div id="title" class="title">New chat</div>
      <button id="dl" class="pill hidden" title="Download simplified PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg><span>Simplified PDF</span></button>
      <button id="cmpBtn" class="pill hidden" title="Compare original and simplified"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="16" rx="1"/><rect x="14" y="4" width="7" height="16" rx="1"/></svg><span>Compare</span></button>
    </header>
    <section id="stage"></section>
  </main>
</div>
<div id="toast"></div>
<input id="file" type="file" accept="application/pdf,.pdf" class="hidden">

<script>
/* ===================== CONFIG ===================== */
const CONFIG = {
  API: 'http://localhost:8080',
  STREAM: true,      // true = /agent_response_stream (live progress); false = /agent_response (sources + verification badge)
  MAX_MB: 10
};

/* ===================== HELPERS ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SPARK = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>';
const state = { token: localStorage.getItem('token'), sessions: [], active: null, busy: false };

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3200);
}

function jwt(t){
  try { const p = t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'); return JSON.parse(atob(p)); }
  catch { return null; }
}
function tokenValid(t){
  const p = t && jwt(t); if (!p) return false;
  return !p.exp || p.exp * 1000 > Date.now();
}
function displayName(sub){
  if (!sub) return 'Account';
  if (sub.startsWith('github_')) return sub.slice(7);
  if (sub.startsWith('google_')) return 'Google account';
  return sub;
}

/* minimal markdown */
function md(src){
  const blocks = [];
  let t = esc(src).replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => { blocks.push(`<pre><code>${c}</code></pre>`); return `\u0000${blocks.length-1}\u0000`; });
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>')
       .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[^*])\*([^\s*][^*\n]*?)\*/g, '$1<em>$2</em>')
       .replace(/\[Page (\d+)(?:, OCR)?\]/g, '<span class="pg">Page $1</span>');
  let out = '', list = null, para = [];
  const flushP = () => { if (para.length){ out += `<p>${para.join('<br>')}</p>`; para = []; } };
  const closeL = () => { if (list){ out += `</${list}>`; list = null; } };
  for (const ln of t.split('\n')){
    let m;
    if ((m = ln.match(/^(#{1,4})\s+(.*)/))){ flushP(); closeL(); const n = Math.min(m[1].length + 2, 6); out += `<h${n}>${m[2]}</h${n}>`; }
    else if ((m = ln.match(/^\s*[-*•]\s+(.*)/))){ flushP(); if (list !== 'ul'){ closeL(); out += '<ul>'; list = 'ul'; } out += `<li>${m[1]}</li>`; }
    else if ((m = ln.match(/^\s*\d+[.)]\s+(.*)/))){ flushP(); if (list !== 'ol'){ closeL(); out += '<ol>'; list = 'ol'; } out += `<li>${m[1]}</li>`; }
    else if (!ln.trim()){ flushP(); closeL(); }
    else { closeL(); para.push(ln); }
  }
  flushP(); closeL();
  return out.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
}

/* fetch wrapper that adds the JWT */
async function api(path, opts = {}){
  const headers = { ...(opts.headers || {}) };
  if (state.token && !opts.public) headers.Authorization = 'Bearer ' + state.token;
  const res = await fetch(CONFIG.API + path, { ...opts, headers });
  if ((res.status === 401 || res.status === 403) && state.token && !opts.public){
    logout('Your session expired. Please sign in again.');
    throw new Error('unauthorized');
  }
  return res;
}

async function login(username, password){
  const res = await api('/login_user', { method: 'POST', public: true, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
  if (res.status === 401) throw new Error('Wrong username or password.');
  if (!res.ok) throw new Error('Sign in failed (' + res.status + ').');
  let txt = (await res.text()).trim();
  try { const j = JSON.parse(txt); if (j.token) txt = j.token; } catch {}
  state.token = txt.replace(/^"|"$/g, '');
  localStorage.setItem('token', state.token);
}

async function processFile(file){
  if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') return toast('Please choose a PDF file.');
  if (file.size > CONFIG.MAX_MB * 1024 * 1024) return toast(`That file is larger than ${CONFIG.MAX_MB} MB.`);
  if (state.busy) return;
  state.busy = true;
  setTop(file.name, false);
  $('#stage').innerHTML = stepsHtml(file.name);
  let step = 0;
  try {
    setStep(0, 'active');
    let id = state.active?.id;
    if (!id){
      const r = await api('/generateSessionId', { method: 'POST' });
      if (!r.ok) throw new Error('Could not start a new chat.');
      id = (await r.json()).sessionId;
    }
    state.active = { id, name: file.name.replace(/\.pdf$/i, '') };

    const fd = new FormData(); fd.append('file', file); fd.append('sessionId', id);
    const up = await api('/uploadPDF', { method: 'POST', body: fd });
    if (!up.ok) throw new Error('The PDF could not be read. Try another file.');
    setStep(0, 'done'); step = 1; setStep(1, 'active');

    const sc = await api('/startChat?sessionId=' + encodeURIComponent(id), { method: 'POST' });
    if (!sc.ok) throw new Error('Processing failed. Make sure the AI model is running, then retry.');
    const summary = await sc.text();
    setStep(1, 'done'); setStep(2, 'done');

    await renameSession(id, state.active.name).catch(() => {});
    await loadSessions();
    await new Promise(r => setTimeout(r, 500));
    showChat([{ role: 'AGENT', message: summary }]);
  } catch (ex){
    if (ex.message === 'unauthorized') return;
    setStep(step, 'fail');
    $('#upErr').innerHTML = `<div class="up-err">${esc(ex.message === 'Failed to fetch' ? 'Cannot reach the server.' : ex.message)}</div>
      <button class="btn retry" id="retry">Choose another PDF</button>`;
    $('#retry').onclick = () => showUpload(state.active?.id || null);
  } finally { state.busy = false; }
}

/* ---------- read aloud (browser speech synthesis) ---------- */
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
const SPEAK_BTN = `<button class="chip speak" type="button" title="Read aloud">${ICON_PLAY}<span>Read aloud</span></button>`;
const speech = { btn: null };

function resetSpeakBtn(btn){
  if (!btn) return;
  btn.classList.remove('on'); btn.innerHTML = `${ICON_PLAY}<span>Read aloud</span>`;
}
function stopSpeech(){
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  resetSpeakBtn(speech.btn); speech.btn = null;
}
function speakChunks(text){
  // split into sentence-sized pieces; long utterances get cut off in some browsers
  const parts = text.match(/[^.!?\n]+[.!?]*\s*/g) || [text];
  const chunks = []; let cur = '';
  parts.forEach(p => {
    if ((cur + p).length > 220 && cur){ chunks.push(cur); cur = p; } else cur += p;
  });
  if (cur.trim()) chunks.push(cur);
  return chunks;
}
function readAloud(btn){
  if (!('speechSynthesis' in window)) return toast('Read aloud is not supported in this browser.');
  const same = speech.btn === btn;
  stopSpeech();
  if (same) return;
  const txtEl = btn.closest('.body')?.querySelector('.txt'); if (!txtEl) return;
  const clone = txtEl.cloneNode(true);
  clone.querySelectorAll('pre').forEach(p => p.remove());
  const text = clone.innerText.replace(/\s+/g, ' ').trim();
  if (!text) return;
  const chunks = speakChunks(text);
  speech.btn = btn; btn.classList.add('on'); btn.innerHTML = `${ICON_STOP}<span>Stop</span>`;
  chunks.forEach((c, i) => {
    const u = new SpeechSynthesisUtterance(c);
    u.lang = navigator.language || 'en-US'; u.rate = 1;
    const end = () => { if (speech.btn === btn && i === chunks.length - 1){ resetSpeakBtn(btn); speech.btn = null; } };
    u.onend = end;
    u.onerror = e => { if (e.error !== 'canceled' && e.error !== 'interrupted') end(); };
    speechSynthesis.speak(u);
  });
}
document.addEventListener('click', e => { const b = e.target.closest('.speak'); if (b) readAloud(b); });
window.addEventListener('beforeunload', () => { if ('speechSynthesis' in window) speechSynthesis.cancel(); });

function scrollDown(force){
  const m = $('#msgs'); if (!m) return;
  if (force || m.scrollHeight - m.scrollTop - m.clientHeight < 140) m.scrollTop = m.scrollHeight;
}
function addUser(text){
  const d = document.createElement('div'); d.className = 'msg user';
  d.innerHTML = `<div class="bubble">${esc(text)}</div>`; $('#col').appendChild(d); return d;
}
function addAgent(text, withTrace = false){
  const d = document.createElement('div'); d.className = 'msg agent';
  d.innerHTML = `<div class="av">${SPARK}</div><div class="body"><div class="txt">${text ? md(text) : ''}</div><div class="status"></div><div class="meta"></div><div class="tools${text ? '' : ' hidden'}">${SPEAK_BTN}</div></div>`;
  $('#col').appendChild(d);
  const out = { txt: $('.txt', d), status: $('.status', d), meta: $('.meta', d), tools: $('.tools', d) };
  if (withTrace){
    const el = document.createElement('details'); el.className = 'trace'; el.open = true;
    el.innerHTML = `<summary><span class="pulse"></span><span class="tl">Starting…</span><span class="car">›</span></summary><div class="flow"></div><ol class="tsteps"></ol>`;
    $('.body', d).insertBefore(el, out.txt);
    out.trace = { el, sum: $('summary', el), flow: $('.flow', el), list: $('.tsteps', el), start: Date.now(), agents: [], steps: 0 };
  }
  return out;
}

const WHO = {
  qa_agent: 'Q&A agent', answer_verifier: 'Verifier agent', general_qa_agent: 'General finance agent',
  postprocessing_qna: 'Pipeline', doc_understanding: 'Understanding agent', simplify_translate: 'Simplifier agent', verifier: 'Verifier agent'
};

/* one step in the collapsible "thinking" panel + the agent flow chips */
function traceStep(b, s){
  const t = b.trace; if (!t) return;
  const who = WHO[s.agent] || s.agent || 'Agent';
  if (s.agent && !t.agents.includes(s.agent)){
    t.agents.push(s.agent);
    const prev = t.flow.querySelector('.fl.on'); if (prev){ prev.classList.remove('on'); prev.classList.add('ok'); }
    if (t.agents.length > 1) t.flow.insertAdjacentHTML('beforeend', '<span class="fa">→</span>');
    t.flow.insertAdjacentHTML('beforeend', `<span class="fl on">${esc(who)}</span>`);
  }
  let html = '', label = '';
  if (s.kind === 'tool_call'){
    const isSearch = s.name === 'search_pdf';
    const q = s.args && s.args.query != null ? s.args.query : JSON.stringify(s.args || {});
    html = `<div class="who">${esc(who)}</div>${isSearch ? 'Searching the document for' : 'Calling ' + esc(s.name)} <code>${esc(String(q).slice(0, 200))}</code>`;
    label = isSearch ? 'Searching the document…' : 'Using ' + s.name + '…';
  } else if (s.kind === 'tool_result'){
    const ps = s.response && s.response.passages;
    if (Array.isArray(ps)){
      const pages = [...new Set(ps.map(p => p.page))].join(', ');
      const head = ps.length ? `Found ${ps.length} passage${ps.length > 1 ? 's' : ''} (page ${esc(pages)})` : esc((s.response && s.response.note) || 'No passages found');
      html = `<div class="who">${esc(who)}</div><details><summary>${head}</summary>` +
        ps.map(p => `<div class="psg"><b>Page ${esc(p.page)}</b> · score ${esc(p.score)}<br>${esc(String(p.text || '').slice(0, 280))}…</div>`).join('') + `</details>`;
    } else {
      html = `<div class="who">${esc(who)}</div><details><summary>${esc(s.name)} returned</summary><div class="psg">${esc(JSON.stringify(s.response || {}).slice(0, 500))}</div></details>`;
    }
    label = 'Reading the results…';
  } else if (s.kind === 'agent_output'){
    const verifier = s.agent === 'answer_verifier';
    html = `<div class="who">${esc(who)}</div><details><summary>${verifier ? 'Verified and corrected the answer' : 'Wrote a draft answer'}</summary><div class="psg">${md(s.text || '')}</div></details>`;
    label = verifier ? 'Verifying the answer…' : who + ' drafted an answer…';
  } else return;
  const li = document.createElement('li'); li.innerHTML = html; t.list.appendChild(li); t.steps++;
  t.sum.querySelector('.tl').textContent = label;
  scrollDown();
}

function traceDone(b){
  const t = b.trace; if (!t) return;
  if (!t.steps){ t.el.remove(); b.trace = null; return; }
  t.flow.querySelectorAll('.fl.on').forEach(x => { x.classList.remove('on'); x.classList.add('ok'); });
  const secs = Math.max(1, Math.round((Date.now() - t.start) / 1000));
  t.sum.innerHTML = `<span class="done-dot"></span><span>Thought for ${secs}s · ${t.agents.length} agent${t.agents.length > 1 ? 's' : ''} · ${t.steps} step${t.steps > 1 ? 's' : ''}</span><span class="car">›</span>`;
  t.el.open = false;
  b.trace = null;
}

const LABELS = {
  qa_agent: 'Searching the document', answer_verifier: 'Verifying the answer', general_qa_agent: 'Looking up trusted sources',
  doc_understanding: 'Reading the document', simplify_translate: 'Simplifying', verifier: 'Verifying', qna_pipeline: 'Working on your question',
  postprocessing_qna: 'Working on your question', coordinator: 'Thinking'
};
const setStatus = (b, text) => {
  if (b.trace){ if (text) b.trace.sum.querySelector('.tl').textContent = text; return; }   // label lives in the trace header
  b.status.innerHTML = text ? `<span class="pulse"></span><span>${esc(text)}</span>` : '';
};

const BADGES = {
  VERIFIED: ['ok', 'Checked against the document'], INSUFFICIENT_EVIDENCE: ['warn', 'Not found in the document'],
  DECLINED: ['warn', 'Advice request declined'], FAILED_VERIFICATION: ['bad', 'Numbers could not be verified'],
  UNVERIFIED: ['warn', 'No page citation']
};
function renderMeta(b, { sources = [], status = null, warnings = [] }){
  let html = '';
  sources.forEach((s, i) => { html += s.excerpt
      ? `<button class="chip" data-ex="${i}" type="button">Page ${esc(s.page)}</button>`
      : `<span class="chip">Page ${esc(s.page)}</span>`; });
  if (status && BADGES[status]) html += `<span class="badge ${BADGES[status][0]}">${BADGES[status][1]}</span>`;
  if (warnings.length) html += `<ul class="warns" style="width:100%">${warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul>`;
  b.meta.innerHTML = html;
  b.meta.onclick = e => {
    const c = e.target.closest('[data-ex]'); if (!c) return;
    let ex = b.meta.querySelector('.excerpt');
    const text = sources[+c.dataset.ex].excerpt;
    if (ex && ex.dataset.i === c.dataset.ex){ ex.remove(); return; }
    if (!ex){ ex = document.createElement('div'); ex.className = 'excerpt'; b.meta.appendChild(ex); }
    ex.dataset.i = c.dataset.ex; ex.textContent = '“' + text + '…”';
  };
}
const pagesFrom = text => [...new Set([...text.matchAll(/page\s*(\d+)/gi)].map(m => +m[1]))].sort((a, b) => a - b).map(p => ({ page: p }));

async function ask(text){
  state.busy = true; $('#send').disabled = true;
  addUser(text);
  const b = addAgent('', true); setStatus(b, 'Processing your question…'); scrollDown(true);
  try {
    if (CONFIG.STREAM){
      try { await streamAnswer(text, b); }
      catch (ex){
        if (ex.partial || ex.message === 'unauthorized') throw ex;
        await structuredAnswer(text, b);   // stream unavailable: fall back
      }
    } else await structuredAnswer(text, b);
  } catch (ex){
    if (ex.message !== 'unauthorized'){
      setStatus(b, '');
      b.txt.innerHTML = `<span class="err-txt">${esc(ex.message === 'Failed to fetch' ? 'Cannot reach the server.' : (ex.userMsg || 'Something went wrong. Please try again.'))}</span>`;
    }
  } finally {
    traceDone(b);
    if (b.txt.textContent.trim() && !b.txt.querySelector('.err-txt')) b.tools.classList.remove('hidden');
    state.busy = false; $('#send').disabled = false; $('#input')?.focus(); scrollDown(true); loadSessions();
  }
}

async function structuredAnswer(text, b){
  const r = await api('/agent_response', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId: state.active.id, message: text }) });
  if (!r.ok) throw Object.assign(new Error('agent ' + r.status), { userMsg: 'The assistant could not answer. Please try again.' });
  const j = await r.json();
  traceDone(b); setStatus(b, ''); b.txt.innerHTML = md(j.answer || '');
  renderMeta(b, { sources: j.sources || [], status: j.verificationStatus, warnings: j.warnings || [] });
}

async function streamAnswer(text, b){
  const res = await fetch(CONFIG.API + '/agent_response_stream', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream', Authorization: 'Bearer ' + state.token },
    body: JSON.stringify({ sessionId: state.active.id, message: text })
  });
  if (res.status === 401 || res.status === 403){ logout('Your session expired. Please sign in again.'); throw new Error('unauthorized'); }
  if (!res.ok || !res.body) throw new Error('stream ' + res.status);

  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '', acc = '', final = null, failed = false, got = false, meta = null;

  const handle = raw => {
    let ev = 'message'; const data = [];
    raw.split('\n').forEach(l => {
      if (l.startsWith('event:')) ev = l.slice(6).trim();
      else if (l.startsWith('data:')) data.push(l.slice(5).replace(/^ /, ''));
    });
    const d = data.join('\n'); got = true;
    if (ev === 'progress'){
      const who = d.replace(/ is working\.\.\.$/, '');
      setStatus(b, LABELS[who] ? LABELS[who] + '…' : d);
    } else if (ev === 'token'){ acc += d; b.txt.innerHTML = md(acc); setStatus(b, 'Writing…'); }
    else if (ev === 'answer') final = d;
    else if (ev === 'step'){ try { traceStep(b, JSON.parse(d)); } catch {} }
    else if (ev === 'meta'){ try { meta = JSON.parse(d); } catch {} }
    else if (ev === 'error') failed = true;
    scrollDown();
  };

  while (true){
    const { value, done } = await reader.read();
    if (done) break;
    buf = (buf + dec.decode(value, { stream: true })).replace(/\r\n/g, '\n');
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0){ handle(buf.slice(0, i)); buf = buf.slice(i + 2); }
  }
  const out = final ?? acc;
  if (failed || !out.trim()){
    throw Object.assign(new Error('stream failed'), { partial: got, userMsg: 'The assistant could not answer. Please try again.' });
  }
  traceDone(b); setStatus(b, ''); b.txt.innerHTML = md(out);
  const notFound = /not found in the document|insufficient evidence/i.test(out);
  if (meta) renderMeta(b, { sources: meta.sources || [], status: meta.verificationStatus, warnings: meta.warnings || [] });
  else renderMeta(b, { sources: pagesFrom(out), status: notFound ? 'INSUFFICIENT_EVIDENCE' : null });
}

/* ===================== BOOT ===================== */
(function boot(){
  if (location.hash.startsWith('#token=')){
    state.token = decodeURIComponent(location.hash.slice(7));
    localStorage.setItem('token', state.token);
    history.replaceState(null, '', location.pathname);
  }
  if (tokenValid(state.token)) enterApp();
  else {
    state.token = null; localStorage.removeItem('token'); $('#auth').classList.remove('hidden');
    fetch(CONFIG.API + '/health').then(r => { if (!r.ok) throw 0; })
      .catch(() => { $('#authErr').textContent = 'Cannot reach the server. Is the backend running?'; });
  }
})();
</script>
